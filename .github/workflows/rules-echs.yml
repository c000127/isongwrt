name: rules-echs-domain
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rules-echs.yml'
      - 'scripts/update-echs-domain.py'
      - 'scripts/test-echs-domain.py'
      - 'scripts/convert-echs-lists.py'
concurrency:
  group: rules-echs-domain-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  SING_BOX_TAG: v1.15.0-alpha.12
  SING_BOX_TAG_COMMIT: 25b0d5ea3e466d246c708ac0f20d0448110e566c
jobs:
  update-domain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify and install pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          got=$(curl -fLsS --retry 3 -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/SagerNet/sing-box/git/ref/tags/${SING_BOX_TAG}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          test "$got" = "$SING_BOX_TAG_COMMIT"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/core.tar.gz" "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_TAG}/sing-box-1.15.0-alpha.12-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/core.tar.gz" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/sing-box-1.15.0-alpha.12-linux-amd64/sing-box"
          test "$("$bin" version | awk '/^Revision:/ {print $2}')" = "$SING_BOX_TAG_COMMIT"
          echo "SING_BOX_BIN=$bin" >> "$GITHUB_ENV"
      - name: Fetch and validate domain set
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 60 -o "$RUNNER_TEMP/domain.list" https://raw.githubusercontent.com/echs-top/proxy/main/list/domain/direct.list
          DOMAIN_FILE="$RUNNER_TEMP/domain.list" python3 scripts/test-echs-domain.py
          DOMAIN_FILE="$RUNNER_TEMP/domain.list" python3 scripts/update-echs-domain.py
      - name: Publish changed domain artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add rules/echsdirect.json rules/echsdirect.srs rules/manifest-echs-domain.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'isongwrt-rules-bot'
          git config user.email 'isongwrt-rules-bot@users.noreply.github.com'
          git commit -m 'rules: update ECH domain list'
          git pull --rebase origin main
          git push origin HEAD:main
