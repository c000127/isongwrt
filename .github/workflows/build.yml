name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # Only build inputs are listed here: a pure docs/rules commit does not build or
    # publish anything. Release-cli changes (install.sh, feed.sh, server/**) are not
    # build inputs either -- they are covered by the `syntax` job when this workflow
    # runs (tag push / workflow_dispatch) or after a decision to widen this list.
    paths:
      - 'luci-app-isongwrt/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

# Two pushes that overlap must not race on the `feed` branch or on release assets:
# the newer run cancels the older one instead of letting it finish last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read by default, write only in the jobs that publish
# (release: release assets, feed: the feed branch).
permissions:
  contents: read

jobs:
  # Parse-only gate. A syntax error in feed.sh once shipped unnoticed and silently
  # broke the whole feed install path, so every script is parsed on each run.
  syntax:
    name: shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: sh -n / dash -n / bash -n
        run: |
          set -euo pipefail
          for f in \
            install.sh \
            feed.sh \
            luci-app-isongwrt/root/usr/lib/isongwrt/ctl \
            luci-app-isongwrt/root/etc/init.d/isongwrt \
            luci-app-isongwrt/root/etc/uci-defaults/99-isongwrt
          do
            [ -f "$f" ] || { echo "missing: $f"; exit 1; }
            echo "-> $f"
            sh -n "$f"
            bash -n "$f"
            dash -n "$f"
          done
          # Bash-only script (arrays): dash is expected to fail here, bash must not.
          echo "-> server/singbox-deploy.sh"
          bash -n server/singbox-deploy.sh
          echo "all scripts parsed OK"

  # CI only builds the LuCI app package (luci-app-isongwrt).
  # The sing-box core is not compiled here: the panel downloads a matching core from
  # the official Releases.
  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialised: two branches in parallel fight over the image/SDK cache
      # ("Unable to reserve cache" in the logs) and host-compile fails intermittently.
      max-parallel: 1
      # Only the targets that are needed today: x86_64 on 24.10 (ipk) and 25.12 (apk).
      # Add rows back here (aarch64_cortex-a53, SNAPSHOT, ...) when they are needed.
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12

    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: build
        # openwrt/gh-action-sdk@main pinned to the commit it pointed at on 2026-08-04.
        # It receives the usign signing key, so a floating ref would let the action's
        # owner replace the code that handles it (and write to this repository).
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: isongwrt
          PACKAGES: luci-app-isongwrt
          # INDEX=1 -> build the feed index (ipk: Packages.gz / apk: packages.adb)
          INDEX: 1
          # Signing key, per branch:
          #  - 24.10 (opkg/ipk): the usign key signs the feed (verified working)
          #  - 25.12 (apk): apk signing fails in this SDK (luci-base/lua host-compile
          #    errors), so the index stays unsigned and clients pass --allow-untrusted
          # The key is also restricted to main and v* tags: a workflow_dispatch run
          # from an arbitrary branch must not be able to use it (review P3-14).
          KEY_BUILD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && matrix.branch == 'openwrt-24.10' && secrets.KEY_BUILD || '' }}
          # apk signing (PRIVATE_KEY) is not enabled: a signed 25.12 build fails in the
          # SDK (luci-base/lua host-compile under CONFIG_SIGNED_PACKAGES). Therefore the
          # 25.12 index is unsigned and feed.sh/install.sh add --allow-untrusted.
          # PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true
          # Consider an `environment:` with required reviewers here to gate the signing
          # key behind a manual approval.

      - name: stage-feed
        run: |
          set -euo pipefail
          mkdir -p public/${{ matrix.branch }}/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/isongwrt public/${{ matrix.branch }}/${{ matrix.arch }}/
          tar -c -z -f isongwrt_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz \
            -C bin/packages/${{ matrix.arch }} isongwrt

      - name: upload
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isongwrt_${{ matrix.arch }}-${{ matrix.branch }}
          path: |
            bin/packages/${{ matrix.arch }}/isongwrt
            isongwrt_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

      - name: upload-feed
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: feed_${{ matrix.arch }}-${{ matrix.branch }}
          path: public

  release:
    name: release packages
    needs: build
    # Publishing is limited to main and v* tags: a dispatch run from a feature branch
    # only produces artifacts, it never overwrites the latest release or a tag.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 20

      - name: download
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: isongwrt_*
          merge-multiple: true
          path: pkgs

      - name: checksums
        run: |
          set -euo pipefail
          cd pkgs
          # Basenames only: users can run `sha256sum -c SHA256SUMS.txt` in the directory
          # where the assets were downloaded (older releases recorded build paths).
          # install.sh matches entries by basename and accepts both forms.
          find . -type f \( -name '*.ipk' -o -name '*.apk' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | awk '{ n=$2; sub(/^\.\//, "", n); sub(/^.*\//, "", n); print $1 "  " n }' \
            > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: release body
        id: body
        run: |
          set -euo pipefail
          PKGVER=$(grep -m1 '^PKG_VERSION:=' luci-app-isongwrt/Makefile | cut -d= -f2)
          PKGREL=$(grep -m1 '^PKG_RELEASE:=' luci-app-isongwrt/Makefile | cut -d= -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            NAME="isongwrt ${GITHUB_REF_NAME}"
            KIND="release (tag \`${GITHUB_REF_NAME}\`)"
            NOTE=""
          else
            NAME="rolling build (main, $(date -u +%Y-%m-%d))"
            KIND="rolling build (main)"
            NOTE="> Rolling build from \`main\`; tagged releases are on the \`v*\` tags."
          fi

          cat > body.md <<'TPL'
          LuCI app for managing a sing-box core on OpenWrt / iStoreOS.

          __NOTE__

          | | |
          |---|---|
          | Version | `__VER__` |
          | Kind | __KIND__ |
          | Commit | `__SHA__` |
          | Built | __BUILT__ |
          | Platforms | `openwrt-24.10` (ipk) · `openwrt-25.12` (apk) · `x86_64` |

          ## Install

          From the feed (adds the feed with its signing key, then installs):

          ```sh
          wget -O - https://cdn.jsdelivr.net/gh/c000127/isongwrt@main/install.sh | sh
          ```

          From the assets below (verify the download first: `sha256sum -c SHA256SUMS.txt`):

          ```sh
          opkg install luci-app-isongwrt_*_all.ipk     # OpenWrt 24.10
          apk add luci-app-isongwrt-*.apk              # OpenWrt 25.12
          ```

          ## Assets

          | File | For |
          |---|---|
          | `luci-app-isongwrt_*_all.ipk` | OpenWrt 24.10 / opkg |
          | `luci-app-isongwrt-*.apk` | OpenWrt 25.12 / apk |
          | `isongwrt_x86_64-*.tar.gz` | package directory with the feed index |
          | `SHA256SUMS.txt` | sha256 of every asset (basenames) |

          ## Notes

          - No core is bundled: the app installs cores from the official
            [SagerNet/sing-box](https://github.com/SagerNet/sing-box/releases) releases,
            matched to the target architecture.
          - Install script: a package taken from Releases is installed only after its
            sha256 matches this release's `SHA256SUMS.txt`.
          - Feed: `https://cdn.jsdelivr.net/gh/c000127/isongwrt@feed`. The ipk index is
            signed with usign and its public key ships with the feed. The apk index is
            **unsigned** (no apk key is published), so the install script passes
            `--allow-untrusted` there.
          - After installing, reload LuCI; menu: **Services → isongwrt**.

          TPL

          # Values come from the Makefile and from a tag name, so they may contain & or |
          # (sed: "whole match" and the delimiter) or a backslash: escape them explicitly.
          # `${var//x/y}` is not an option here: bash >= 5.2 expands & in the replacement.
          esc() { printf '%s' "$1" | sed -e 's/[\\&|]/\\&/g'; }
          sed -i \
            -e "s|__VER__|$(esc "${PKGVER}-r${PKGREL}")|" \
            -e "s|__KIND__|$(esc "$KIND")|" \
            -e "s|__SHA__|$(esc "$SHORT_SHA")|" \
            -e "s|__BUILT__|$(esc "$BUILT")|" \
            -e "s|__NOTE__|$(esc "$NOTE")|" \
            body.md
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "--- body.md ---"; cat body.md

      - name: prune stale assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="latest"
          case "${GITHUB_REF:-}" in refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;; esac
          stale=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            # Only assets this workflow owns may be pruned.
            case "$name" in
              *.ipk|*.apk|*.tar.gz|SHA256SUMS.txt) ;;
              *) echo "keeping (not managed by this workflow): $name"; continue ;;
            esac
            find pkgs -name "$name" | grep -q . || stale+=("$name")
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)

          if [ ${#stale[@]} -eq 0 ]; then
            echo "no stale assets on ${TAG}"
            exit 0
          fi
          # Print the full list (and keep it in the job summary) before deleting anything.
          {
            echo "### stale assets on \`${TAG}\`"
            printf -- '- %s\n' "${stale[@]}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
          for name in "${stale[@]}"; do
            echo "deleting stale asset: $name"
            gh release delete-asset "$TAG" "$name" --yes || true
          done

      - name: release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        # softprops/action-gh-release v3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: ${{ steps.body.outputs.name }}
          body_path: body.md
          make_latest: true
          files: |
            pkgs/**/*.ipk
            pkgs/**/*.apk
            pkgs/*.tar.gz
            pkgs/SHA256SUMS.txt

      - name: release (latest)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        # softprops/action-gh-release v3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: latest
          name: ${{ steps.body.outputs.name }}
          body_path: body.md
          prerelease: true
          make_latest: false
          files: |
            pkgs/**/*.ipk
            pkgs/**/*.apk
            pkgs/*.tar.gz
            pkgs/SHA256SUMS.txt

  feed:
    name: publish feed branch
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: feed_*
          merge-multiple: true
          path: public

      - name: feed signing key
        env:
          KEY_BUILD_PUB: ${{ secrets.KEY_BUILD_PUB }}
        run: |
          set -euo pipefail
          # opkg (24.10) verifies the signed index with this key, so it is published.
          # The apk (25.12) index is built unsigned, therefore no apk public key is
          # published: a key that verifies nothing would wrongly suggest the apk feed
          # is signed. feed.sh tells the user the apk index is unsigned instead.
          if [ -n "${KEY_BUILD_PUB}" ]; then
            printf '%s\n' "$KEY_BUILD_PUB" > public/key-build.pub
          else
            echo "KEY_BUILD_PUB is not set: the feed will carry no opkg signing key"
          fi
          find public -maxdepth 3 -type f | sort | head -20

      - name: publish
        # peaceiris/actions-gh-pages v4
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: feed
          publish_dir: public
          force_orphan: true
          enable_jekyll: false
          commit_message: 'feed: ${{ github.sha }}'
