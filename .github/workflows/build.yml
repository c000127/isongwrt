name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'luci-app-isongwrt/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 仅构建当前需要的目标：x86_64 的 24.10(ipk) 与 25.12(apk)。
      # 后续需要其它架构/分支时，在下面两行里加回来即可（例如 aarch64_cortex-a53、SNAPSHOT）。
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: isongwrt
          PACKAGES: luci-app-isongwrt
          # INDEX=1 → 生成 feed 索引（ipk: Packages.gz / apk: packages.adb）
          INDEX: 1
          # 可选签名：配置对应 secrets 后 feed 自动签名（留空 = 未签名，安装时用 --allow-untrusted）
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: stage-feed
        run: |
          mkdir -p public/${{ matrix.branch }}/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/isongwrt public/${{ matrix.branch }}/${{ matrix.arch }}/
          tar -c -z -f isongwrt_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz \
            -C bin/packages/${{ matrix.arch }} isongwrt

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: isongwrt_${{ matrix.arch }}-${{ matrix.branch }}
          path: |
            bin/packages/${{ matrix.arch }}/isongwrt
            isongwrt_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

      - name: upload-feed
        uses: actions/upload-artifact@v7
        with:
          name: feed_${{ matrix.arch }}-${{ matrix.branch }}
          path: public

  release:
    name: release packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: isongwrt_*
          merge-multiple: true
          path: pkgs

      - name: checksums
        run: |
          cd pkgs
          find . -name '*.ipk' -o -name '*.apk' | sort | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: release body
        run: |
          cat > body.md <<'EOF'
          OpenWrt / iStoreOS 的 sing-box 管理面板（LuCI）：内核分级管理（stable/rc/beta/alpha）、
          配置上传与校验、启停控制、日志查看、官方 dashboard 一键托管。

          **支持**：`openwrt-24.10`（ipk/opkg）· `openwrt-25.12`（apk）· `x86_64`

          ### 安装

          ```sh
          # 推荐：一键（自动添加 feed 并安装，签名源自动导入公钥）
          wget -O - https://raw.githubusercontent.com/c000127/isongwrt/main/install.sh | sh

          # 或直接安装本页附件
          opkg install luci-app-isongwrt_*_all.ipk              # 24.10
          apk add luci-app-isongwrt-*.apk                       # 25.x
          ```

          ### 附件说明

          | 文件 | 用途 |
          |---|---|
          | `luci-app-isongwrt_*_all.ipk` | OpenWrt 24.10 / opkg |
          | `luci-app-isongwrt-*.apk` | OpenWrt 25.12 / apk |
          | `isongwrt_x86_64-*.tar.gz` | 完整包目录（含 feed 索引） |
          | `SHA256SUMS.txt` | 校验和 |

          安装后菜单：**服务 → isongwrt**
          EOF
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" != "true" ]; then
            printf '\n> 本页为 **main 分支滚动构建**（预发布），仅供测试；正式版见 `v*` 标签。\n' >> body.md
          fi
          echo "--- body.md ---"; cat body.md

      # 打 tag（v*）→ 正式 Release，标题带版本号
      - name: release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: isongwrt ${{ github.ref_name }}
          body_path: body.md
          make_latest: true
          files: |
            pkgs/*.ipk
            pkgs/*.apk
            pkgs/*.tar.gz
            pkgs/SHA256SUMS.txt

      # 手动触发 / main 推送 → 更新滚动 latest（预发布）
      - name: release (latest)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: 滚动最新构建（main）
          body_path: body.md
          prerelease: true
          make_latest: false
          files: |
            pkgs/*.ipk
            pkgs/*.apk
            pkgs/*.tar.gz
            pkgs/SHA256SUMS.txt
