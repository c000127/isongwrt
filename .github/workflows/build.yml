name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'luci-app-isongwrt/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 说明：CI 只构建 LuCI 应用包（luci-app-isongwrt）。
  # sing-box 内核不在此编译——由面板「内核管理」从官方 Releases 下载匹配架构的内核。
  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 串行执行：两个分支并发出镜像/SDK 缓存争用（日志可见 "Unable to reserve cache"），
      # 会造成 host-compile 偶发失败
      max-parallel: 1
      # 仅构建当前需要的目标：x86_64 的 24.10(ipk) 与 25.12(apk)。
      # 后续需要其它架构/分支时，在下面两行里加回来即可（例如 aarch64_cortex-a53、SNAPSHOT）。
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: isongwrt
          PACKAGES: luci-app-isongwrt
          # INDEX=1 → 生成 feed 索引（ipk: Packages.gz / apk: packages.adb）
          INDEX: 1
          # 按分支分别签名：
          #  - 24.10（opkg/ipk）：usign 密钥签名 feed（已验证可用）
          #  - 25.12（apk）：SDK 侧 apk 签名构建目前失败（luci-base/lua host-compile 报错），
          #    故暂不传 PRIVATE_KEY → 索引未签名，客户端用 --allow-untrusted（脚本已自动处理）
          KEY_BUILD: ${{ matrix.branch == 'openwrt-24.10' && secrets.KEY_BUILD || '' }}
          # apk 签名（PRIVATE_KEY）暂不启用：SDK 侧 25.12 带签名构建会失败
          # （luci-base/lua host-compile 报错，疑与 CONFIG_SIGNED_PACKAGES 下的构建差异有关）。
          # 因此 25.12 的索引未签名，客户端由 feed.sh/install.sh 自动加 --allow-untrusted。
          # PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: stage-feed
        run: |
          mkdir -p public/${{ matrix.branch }}/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/isongwrt public/${{ matrix.branch }}/${{ matrix.arch }}/
          tar -c -z -f isongwrt_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz \
            -C bin/packages/${{ matrix.arch }} isongwrt

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: isongwrt_${{ matrix.arch }}-${{ matrix.branch }}
          path: |
            bin/packages/${{ matrix.arch }}/isongwrt
            isongwrt_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

      - name: upload-feed
        uses: actions/upload-artifact@v7
        with:
          name: feed_${{ matrix.arch }}-${{ matrix.branch }}
          path: public

  release:
    name: release packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: isongwrt_*
          merge-multiple: true
          path: pkgs

      - name: checksums
        run: |
          cd pkgs
          find . -name '*.ipk' -o -name '*.apk' | sort | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: release body
        id: body
        run: |
          PKGVER=$(grep -m1 '^PKG_VERSION:=' luci-app-isongwrt/Makefile | cut -d= -f2)
          PKGREL=$(grep -m1 '^PKG_RELEASE:=' luci-app-isongwrt/Makefile | cut -d= -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMITS=$(git log --oneline -6 | sed 's/^/- `/; s/$/`/')

          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            NAME="isongwrt ${{ github.ref_name }}"
            KIND="正式发布（tag \`${{ github.ref_name }}\`）"
            NOTE=""
          else
            NAME="滚动构建（main · $(date -u +%Y-%m-%d)）"
            KIND="滚动构建（main 分支自动构建）"
            NOTE="> ⚠️ 本页为 **滚动构建**，仅供测试与快速取用；正式版见 \`v*\` 标签。"
          fi

          cat > body.md <<'TPL'
          OpenWrt / iStoreOS 上的 **sing-box 管理面板**（LuCI）：内核分级管理 · 配置上传校验 · 启停控制 · 日志 · 官方 dashboard 一键托管。

          __NOTE__

          | 项目 | 值 |
          |---|---|
          | 版本 | `__VER__` |
          | 类型 | __KIND__ |
          | 提交 | `__SHA__` __SUBJECT__ |
          | 构建时间 | __BUILT__ |
          | 支持平台 | `openwrt-24.10`（ipk/opkg）· `openwrt-25.12`（apk）· `x86_64` |

          ## 安装

          **方式一：一键（推荐）** — 自动识别版本/架构、添加 feed（含签名公钥）并安装

          ```sh
          wget -O - https://cdn.jsdelivr.net/gh/c000127/isongwrt@main/install.sh | sh
          ```

          **方式二：安装本页附件**

          ```sh
          opkg install luci-app-isongwrt_*_all.ipk     # OpenWrt 24.10
          apk add luci-app-isongwrt-*.apk              # OpenWrt 25.12
          ```

          ## 附件

          | 文件 | 适用 |
          |---|---|
          | `luci-app-isongwrt_*_all.ipk` | OpenWrt 24.10 / opkg |
          | `luci-app-isongwrt-*.apk` | OpenWrt 25.12 / apk |
          | `isongwrt_x86_64-*.tar.gz` | 完整包目录（含 feed 索引） |
          | `SHA256SUMS.txt` | 校验和 |

          ## 说明

          - **内核不随本包发布**：面板「内核管理」从官方 [SagerNet/sing-box](https://github.com/SagerNet/sing-box/releases) 按架构自动下载（优先 musl），支持 stable / rc / beta / alpha 与指定版本。
          - **feed**：`https://cdn.jsdelivr.net/gh/c000127/isongwrt@feed` —— ipk 索引已用 usign 签名（公钥随 feed 发布），apk 索引未签名（安装脚本自动加 `--allow-untrusted`）。
          - 安装后菜单：**服务 → isongwrt**；面板入口 `http://<路由器>:<api_port>/dashboard/`。

          ## 本次提交

          __COMMITS__
          TPL

          sed -i -e "s|__VER__|${PKGVER}-r${PKGREL}|" \
                 -e "s|__KIND__|${KIND}|" \
                 -e "s|__SHA__|${SHORT_SHA}|" \
                 -e "s|__SUBJECT__|${SUBJECT}|" \
                 -e "s|__BUILT__|${BUILT}|" \
                 -e "s|__NOTE__|${NOTE}|" body.md
          # 多行提交列表单独替换
          printf '%s\n' "$COMMITS" > commits.txt
          python3 - <<'PY'
          import pathlib
          c = pathlib.Path('commits.txt').read_text().strip() or '- （无）'
          p = pathlib.Path('body.md')
          p.write_text(p.read_text().replace('__COMMITS__', c))
          PY
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "--- body.md ---"; cat body.md

      - name: release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.body.outputs.name }}
          body_path: body.md
          make_latest: true
          files: |
            pkgs/**/*.ipk
            pkgs/**/*.apk
            pkgs/*.tar.gz
            pkgs/SHA256SUMS.txt

      - name: release (latest)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: ${{ steps.body.outputs.name }}
          body_path: body.md
          prerelease: true
          make_latest: false
          files: |
            pkgs/**/*.ipk
            pkgs/**/*.apk
            pkgs/*.tar.gz
            pkgs/SHA256SUMS.txt

  feed:
    name: publish feed branch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: feed_*
          merge-multiple: true
          path: public

      - name: public keys
        env:
          KEY_BUILD_PUB: ${{ secrets.KEY_BUILD_PUB }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          if [ -n "$KEY_BUILD_PUB" ]; then printf '%s\n' "$KEY_BUILD_PUB" > public/key-build.pub; fi
          if [ -n "$PUBLIC_KEY" ]; then printf '%s\n' "$PUBLIC_KEY" > public/public-key.pem; fi
          find public -maxdepth 3 -type f | sort | head -20

      - name: publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: feed
          publish_dir: public
          force_orphan: true
          enable_jekyll: false
          commit_message: 'feed: ${{ github.sha }}'
