name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'luci-app-isongwrt/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 仅构建当前需要的目标：x86_64 的 24.10(ipk) 与 25.12(apk)。
      # 后续需要其它架构/分支时，在下面两行里加回来即可（例如 aarch64_cortex-a53、SNAPSHOT）。
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: isongwrt
          PACKAGES: luci-app-isongwrt
          NO_REFRESH_CHECK: true

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: isongwrt_${{ matrix.arch }}-${{ matrix.branch }}
          path: bin/packages/${{ matrix.arch }}/isongwrt
