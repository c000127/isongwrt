name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'luci-app-isongwrt/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 说明：CI 只构建 LuCI 应用包（luci-app-isongwrt）。
  # sing-box 内核不在此编译——由面板「内核管理」从官方 Releases 下载匹配架构的内核。
  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 串行执行：两个分支并发出镜像/SDK 缓存争用（日志可见 "Unable to reserve cache"），
      # 会造成 host-compile 偶发失败
      max-parallel: 1
      # 仅构建当前需要的目标：x86_64 的 24.10(ipk) 与 25.12(apk)。
      # 后续需要其它架构/分支时，在下面两行里加回来即可（例如 aarch64_cortex-a53、SNAPSHOT）。
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-24.10
          - openwrt-25.12

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: isongwrt
          PACKAGES: luci-app-isongwrt
          # INDEX=1 → 生成 feed 索引（ipk: Packages.gz / apk: packages.adb）
          INDEX: 1
          # 按分支分别签名：
          #  - 24.10（opkg/ipk）：usign 密钥签名 feed（已验证可用）
          #  - 25.12（apk）：SDK 侧 apk 签名构建目前失败（luci-base/lua host-compile 报错），
          #    故暂不传 PRIVATE_KEY → 索引未签名，客户端用 --allow-untrusted（脚本已自动处理）
          KEY_BUILD: ${{ matrix.branch == 'openwrt-24.10' && secrets.KEY_BUILD || '' }}
          # apk 签名（PRIVATE_KEY）暂不启用：SDK 侧 25.12 带签名构建会失败
          # （luci-base/lua host-compile 报错，疑与 CONFIG_SIGNED_PACKAGES 下的构建差异有关）。
          # 因此 25.12 的索引未签名，客户端由 feed.sh/install.sh 自动加 --allow-untrusted。
          # PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: stage-feed
        run: |
          mkdir -p public/${{ matrix.branch }}/${{ matrix.arch }}
          cp -r bin/packages/${{ matrix.arch }}/isongwrt public/${{ matrix.branch }}/${{ matrix.arch }}/
          tar -c -z -f isongwrt_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz \
            -C bin/packages/${{ matrix.arch }} isongwrt

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: isongwrt_${{ matrix.arch }}-${{ matrix.branch }}
          path: |
            bin/packages/${{ matrix.arch }}/isongwrt
            isongwrt_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

      - name: upload-feed
        uses: actions/upload-artifact@v7
        with:
          name: feed_${{ matrix.arch }}-${{ matrix.branch }}
          path: public

  release:
    name: release packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: isongwrt_*
          merge-multiple: true
          path: pkgs

      - name: checksums
        run: |
          cd pkgs
          find . -name '*.ipk' -o -name '*.apk' | sort | xargs -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: release body
        id: body
        run: |
          PKGVER=$(grep -m1 '^PKG_VERSION:=' luci-app-isongwrt/Makefile | cut -d= -f2)
          PKGREL=$(grep -m1 '^PKG_RELEASE:=' luci-app-isongwrt/Makefile | cut -d= -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            NAME="isongwrt ${{ github.ref_name }}"
            KIND="release (tag \`${{ github.ref_name }}\`)"
            NOTE=""
          else
            NAME="rolling build (main, $(date -u +%Y-%m-%d))"
            KIND="rolling build (main)"
            NOTE="> Rolling build from \`main\`; tagged releases are on the \`v*\` tags."
          fi

          cat > body.md <<'TPL'
          LuCI app for managing a sing-box core on OpenWrt / iStoreOS.

          __NOTE__

          | | |
          |---|---|
          | Version | `__VER__` |
          | Kind | __KIND__ |
          | Commit | `__SHA__` |
          | Built | __BUILT__ |
          | Platforms | `openwrt-24.10` (ipk) · `openwrt-25.12` (apk) · `x86_64` |

          ## Install

          From the feed (adds the feed with its signing key, then installs):

          ```sh
          wget -O - https://cdn.jsdelivr.net/gh/c000127/isongwrt@main/install.sh | sh
          ```

          From the assets below:

          ```sh
          opkg install luci-app-isongwrt_*_all.ipk     # OpenWrt 24.10
          apk add luci-app-isongwrt-*.apk              # OpenWrt 25.12
          ```

          ## Assets

          | File | For |
          |---|---|
          | `luci-app-isongwrt_*_all.ipk` | OpenWrt 24.10 / opkg |
          | `luci-app-isongwrt-*.apk` | OpenWrt 25.12 / apk |
          | `isongwrt_x86_64-*.tar.gz` | package directory with the feed index |
          | `SHA256SUMS.txt` | checksums |

          ## Notes

          - No core is bundled: the app installs cores from the official
            [SagerNet/sing-box](https://github.com/SagerNet/sing-box/releases) releases,
            matched to the target architecture.
          - Feed: `https://cdn.jsdelivr.net/gh/c000127/isongwrt@feed` (the ipk index is signed
            with usign and the public key ships with the feed; the apk index is unsigned, so the
            install script passes `--allow-untrusted`).
          - After installing, reload LuCI; menu: **Services → isongwrt**.

          TPL

          sed -i -e "s|__VER__|${PKGVER}-r${PKGREL}|" \
                 -e "s|__KIND__|${KIND}|" \
                 -e "s|__SHA__|${SHORT_SHA}|" \
                 -e "s|__SUBJECT__|${SUBJECT}|" \
                 -e "s|__BUILT__|${BUILT}|" \
                 -e "s|__NOTE__|${NOTE}|" body.md
          # 多行提交列表单独替换
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "--- body.md ---"; cat body.md

      - name: prune stale assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          case "${{ github.ref }}" in refs/tags/*) TAG="${{ github.ref_name }}" ;; esac
          gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | while read -r name; do
            [ -n "$name" ] || continue
            if ! find pkgs -name "$name" | grep -q .; then
              echo "deleting stale asset: $name"
              gh release delete-asset "$TAG" "$name" --yes || true
            fi
          done || true

      - name: release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.body.outputs.name }}
          body_path: body.md
          make_latest: true
          files: |
            pkgs/**/*.ipk
            pkgs/**/*.apk
            pkgs/*.tar.gz
            pkgs/SHA256SUMS.txt

      - name: release (latest)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: ${{ steps.body.outputs.name }}
          body_path: body.md
          prerelease: true
          make_latest: false
          files: |
            pkgs/**/*.ipk
            pkgs/**/*.apk
            pkgs/*.tar.gz
            pkgs/SHA256SUMS.txt

  feed:
    name: publish feed branch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download
        uses: actions/download-artifact@v8
        with:
          pattern: feed_*
          merge-multiple: true
          path: public

      - name: public keys
        env:
          KEY_BUILD_PUB: ${{ secrets.KEY_BUILD_PUB }}
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
        run: |
          if [ -n "$KEY_BUILD_PUB" ]; then printf '%s\n' "$KEY_BUILD_PUB" > public/key-build.pub; fi
          if [ -n "$PUBLIC_KEY" ]; then printf '%s\n' "$PUBLIC_KEY" > public/public-key.pem; fi
          find public -maxdepth 3 -type f | sort | head -20

      - name: publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: feed
          publish_dir: public
          force_orphan: true
          enable_jekyll: false
          commit_message: 'feed: ${{ github.sha }}'
